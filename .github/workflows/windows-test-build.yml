name: Windows Test Build

# Builds a self-contained Windows test package (ZenithBusiness.exe + a fresh
# pre-seeded sample database + launcher + owner instructions) and uploads it as a
# downloadable artifact. This does NOT change any application functionality — it
# only packages the current source exactly as it is.
#
# Run it manually from the Actions tab (Run workflow), or it runs automatically
# on pushes to the development branch that touch the app or the packaging kit.
#
# The stage the build belongs to is set ONCE in env.STAGE below: it names the
# release tag, its title and the ZIP, so moving to the next stage is a one-line
# change instead of a hunt through this file.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/zenith-business-architecture-ywcgpe
    paths:
      - "zenith_business/**"
      - "packaging/**"
      - ".github/workflows/windows-test-build.yml"

permissions:
  contents: write   # needed to publish the ZIP as a GitHub Release asset

env:
  STAGE: "10"
  # Releases from earlier stages, removed once the new one is published so the
  # owner never has two differently-named ZIPs to choose between.
  SUPERSEDED_TAGS: "stage05-test-build stage06-test-build stage07-test-build stage08-test-build stage09-test-build"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # The Dari sheet asks for the bundled Vazirmatn with no fallback, which
      # only helps if Windows actually has it registered. Segoe UI and Tahoma
      # exist here and do NOT exist on the Linux dev machine, so this is the
      # platform where a silent substitution would happen — verify it here
      # rather than infer it from a machine that cannot reproduce the problem.
      - name: Verify the Dari report font resolves to bundled Vazirmatn (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          python -m pytest tests/test_stage08_report_fixes.py -v -k "font or dari or bundled"

      # Licensing and backup encryption are the two places where a silent
      # failure is worst, so they are exercised on the platform that ships.
      # The lockout joins them: locking the owner out of their own books is the
      # one security failure that hurts the customer rather than an attacker,
      # and half of it is Qt behaviour that only the shipping platform proves.
      # The final pass joins them for a reason of its own: the anti-rollback
      # clock seals its state with DPAPI, which exists only on Windows. On Linux
      # the fallback path is what gets exercised, so the real one would never be
      # tested anywhere if not here.
      - name: Verify licensing, backup encryption, lockout and the gate (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_stage10_hardening.py tests/test_stage10_licensing.py tests/test_stage10_lockout.py tests/test_stage10_final.py tests/test_vendor_license_manager.py -q

      - name: Freeze ZenithBusiness.exe
        run: pyinstaller packaging/zenith_business.spec --noconfirm --clean

      - name: Assemble portable package
        shell: pwsh
        run: |
          $pkg = "dist/package"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Recurse -Force "dist/ZenithBusiness" "$pkg/app"
          Copy-Item -Force "packaging/Run-ZenithBusiness.bat" "$pkg/"
          Copy-Item -Force "packaging/Reset-Test-Data.bat" "$pkg/"
          Copy-Item -Force "packaging/READ-ME-FIRST.md" "$pkg/READ-ME-FIRST.txt"
          Write-Host "Seeding fresh sample database..."
          python packaging/seed_test_db.py "$pkg/appdata"
          Copy-Item -Recurse -Force "$pkg/appdata" "$pkg/appdata_seed"

      # Scan the REAL package — every file a customer would receive, including
      # the bytes inside the frozen exe and its archive. A source-level check
      # would miss the one failure that matters: a file collected by accident.
      - name: Security audit of the release package
        run: python packaging/audit_release_package.py dist/package

      # Ask the FROZEN BINARY what it is. A byte scan cannot prove the licence
      # path works — PyInstaller zlib-compresses the Python archive, so our own
      # module strings are invisible to it. Running the exe is the honest check.
      - name: Ask the frozen build to report its security state
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          ZENITH_DATA_HOME: dist/selftest-home
        run: |
          # The shipped exe is WINDOWED, so it has no stdout to read. It writes
          # its report to a file; that is the only thing CI can rely on.
          $report = "dist/selftest-report.txt"
          $proc = Start-Process -FilePath "dist/ZenithBusiness/ZenithBusiness.exe" `
            -ArgumentList "--selftest","--selftest-out=$report" -PassThru -Wait
          if (-not (Test-Path $report)) {
            throw "frozen build wrote no self-test report (exit $($proc.ExitCode))"
          }
          $text = Get-Content $report -Raw
          Write-Host $text
          if ($proc.ExitCode -ne 0) { throw "frozen build failed its self-test" }
          foreach ($needed in @("signature verify     : True",
                                "backup encryption    : True",
                                "SELFTEST             : OK")) {
            if ($text -notmatch [regex]::Escape($needed)) {
              throw "frozen build did not report: $needed"
            }
          }
          Write-Host "Frozen build verified its own crypto and licence path."

      - name: Smoke-check the frozen build starts (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          ZENITH_DATA_HOME: dist/package/appdata
        run: |
          # Launch briefly to confirm the exe and its Qt runtime load, then close.
          $p = Start-Process -FilePath "dist/ZenithBusiness/ZenithBusiness.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited -and $p.ExitCode -ne 0) {
            throw "Frozen app exited early with code $($p.ExitCode)"
          }
          if (-not $p.HasExited) { $p.Kill() }
          Write-Host "Frozen build launched cleanly."

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: ZenithBusiness-Stage${{ env.STAGE }}-TestBuild-win64
          path: dist/package
          retention-days: 14
          if-no-files-found: error

      - name: Upload the vendor License Manager
        uses: actions/upload-artifact@v4
        with:
          name: ZenithSoft-LicenseManager-win64
          path: dist/ZenithLicenseManager
          retention-days: 14
          if-no-files-found: error

      # Delivery-only: zip the portable package and attach it to a GitHub Release
      # so it has a permanent, one-click Download link (no Actions navigation, no
      # expiry). This does not change the application or any source.
      # The VENDOR tool, built as a separate download. It is never placed
      # inside the customer package - that is the whole point of the pairing -
      # so it is frozen from its own spec, into its own folder, and zipped on
      # its own.
      - name: Freeze the vendor License Manager
        run: pyinstaller packaging/zenith_license_manager.spec --noconfirm --clean

      # Asked of the CUSTOMER package: it must not contain the vendor tool.
      # The audit step above already fails on the module name; this proves the
      # executable itself is absent, which is the thing a person would look for.
      - name: Confirm the vendor tool is NOT in the customer package
        shell: pwsh
        run: |
          $found = Get-ChildItem -Recurse dist/package -Filter "*LicenseManager*" `
            -ErrorAction SilentlyContinue
          if ($found) { throw "the vendor License Manager reached the customer package" }
          Write-Host "Customer package contains no License Manager."

      - name: Zip the portable package
        shell: pwsh
        run: |
          $zip = "ZenithBusiness-Stage${env:STAGE}-TestBuild-win64.zip"
          Compress-Archive -Path dist/package/* -DestinationPath $zip -Force
          Write-Host ("Zip size: {0:N1} MB" -f ((Get-Item $zip).Length/1MB))
          $vzip = "ZenithSoft-LicenseManager-win64.zip"
          Copy-Item -Force "vendor/README-VENDOR.md" "dist/ZenithLicenseManager/READ-ME-VENDOR.txt"
          Compress-Archive -Path dist/ZenithLicenseManager/* -DestinationPath $vzip -Force
          Write-Host ("Manager zip: {0:N1} MB" -f ((Get-Item $vzip).Length/1MB))

      - name: Publish as a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="stage${STAGE}-test-build"
          ZIP="ZenithBusiness-Stage${STAGE}-TestBuild-win64.zip"
          MANAGER_ZIP="ZenithSoft-LicenseManager-win64.zip"

          # PROVE we can publish BEFORE destroying what the owner is currently
          # downloading. This step used to delete the existing release first and
          # swallow the result with `|| true`; when the token later lost release
          # permission, the delete went through, the create returned HTTP 403,
          # and the owner was left with no download link at all. A throwaway
          # draft nobody ever sees is the cheapest way to ask "may I?" — and if
          # the answer is no, the existing release stays exactly where it is.
          PROBE="ci-release-permission-probe-${GITHUB_RUN_ID}"
          if ! gh release create "$PROBE" --draft --notes "permission probe" >/dev/null 2>&1; then
            echo "::error::This workflow's token cannot create releases, so the"
            echo "::error::package was NOT published and the previous download"
            echo "::error::link has been left untouched. The build itself is fine"
            echo "::error::- the ZIP is attached to this run as an artifact."
            echo "::error::Fix: repository Settings -> Actions -> General ->"
            echo "::error::Workflow permissions -> Read and write permissions."
            exit 1
          fi
          gh release delete "$PROBE" --cleanup-tag --yes >/dev/null 2>&1 || true

          # Replace any previous copy so the download link is always the latest build.
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$ZIP" "$MANAGER_ZIP" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Zenith Business — Stage ${STAGE} Windows Test Build" \
            --notes "Self-contained Windows test build including the locked Stages 01-09 and Stage 10 (Single-PC Security, Backup & Licensing), with a fresh pre-seeded sample database. Download the ZIP, unzip, and double-click Run-ZenithBusiness.bat. IMPORTANT — licensing is now checked BEFORE login: the first screen is Activation, and an unlicensed computer cannot reach the login form or the program behind it. Copy the Request Code, send it to Zenith Soft, paste back the Product Key, press Activate - then log in (admin / Admin@123). ZenithSoft-LicenseManager-win64.zip on this release is the VENDOR tool that issues those keys: it is for Zenith Soft only and must never be given to a customer. Full click-by-click test steps are in READ-ME-FIRST inside the package. This is a TEST build for owner acceptance — Stage 10 is not locked or merged."
          # Retire the earlier stage's release so only one download link exists.
          for old in $SUPERSEDED_TAGS; do
            gh release delete "$old" --cleanup-tag --yes || true
          done
          echo "Release published:"
          gh release view "$TAG" --json url --jq .url
